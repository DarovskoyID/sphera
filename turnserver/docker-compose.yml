# ─────────────────────────────────────────────────────────────────────────────
# coturn — собственный TURN/STUN сервер для WebRTC
#
# Запуск:    docker compose up -d
# Логи:      docker compose logs -f
# Стоп:      docker compose down
#
# Сертификаты берутся из D:\nginx-1.29.8\ssl\ (те же что у Daphne).
# ─────────────────────────────────────────────────────────────────────────────

services:
  coturn:
    image: coturn/coturn:latest
    container_name: ionik-coturn
    restart: unless-stopped
    # network_mode: host НЕ работает на Windows Docker Desktop, поэтому
    # пробрасываем порты явно.
    ports:
      - "3478:3478/udp"      # STUN/TURN UDP
      - "3478:3478/tcp"      # STUN/TURN TCP
      - "5349:5349/udp"      # TURN over TLS (UDP/DTLS)
      - "5349:5349/tcp"      # TURN over TLS (TCP/TLS)
      # Диапазон relay-портов. Сильно сужен (обычно нужны тысячи), но
      # для пары пользователей хватит. Можно расширить если нужно.
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - "D:/nginx-1.29.8/ssl/fullchain.pem:/certs/fullchain.pem:ro"
      - "D:/nginx-1.29.8/ssl/privkey.pem:/certs/privkey.pem:ro"
