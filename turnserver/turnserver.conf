# ───────────────────── coturn config ─────────────────────
# Подробнее: https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf

# Основной listening порт (STUN + TURN)
listening-port=3478
# Порт для TURN over TLS / DTLS
tls-listening-port=5349

# На каких интерфейсах слушать. 0.0.0.0 = все.
listening-ip=0.0.0.0

# IP который coturn анонсирует клиентам как relay-адрес.
# ОБЯЗАТЕЛЬНО публичный IP сервера, иначе клиенты не смогут подключиться
# к relay-адресу.  Замени если у тебя другой IP/домен.
external-ip=89.208.74.21
relay-ip=0.0.0.0

# Диапазон портов которые coturn будет использовать для relay-сессий.
# Должен совпадать с пробросом портов в docker-compose.yml.
min-port=49160
max-port=49200

# realm = домен сервера (используется в long-term auth)
realm=bottomweb.ru

# Аутентификация по логину/паролю (long-term credentials).
# Для прода создай отдельных пользователей!  Это тестовый аккаунт.
lt-cred-mech
user=ionikuser:ionikturn123

# TLS сертификаты (тот же сертификат что у HTTPS-сайта)
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem

# Запрет на использование coturn как открытого relay (защита от злоупотреблений)
no-multicast-peers
no-loopback-peers
# Блокирует попытки relay-ить трафик в приватные сети (защита от SSRF)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
allowed-peer-ip=0.0.0.0-9.255.255.255
allowed-peer-ip=11.0.0.0-126.255.255.255
allowed-peer-ip=128.0.0.0-169.253.255.255
allowed-peer-ip=169.255.0.0-172.15.255.255
allowed-peer-ip=172.32.0.0-192.167.255.255
allowed-peer-ip=192.169.0.0-255.255.255.255

# Не давать STUN BINDING запросам относительный приоритет
no-stun-backward-compatibility

# Отключаем CLI/admin интерфейс (не нужен)
no-cli

# Логи в stdout (Docker подхватит)
verbose
log-file=stdout
