name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after CI
        type: boolean
        default: false
      setup_mail:
        description: >-
          One-time — install the self-hosted mail server (Postfix + OpenDKIM)
          for SFERA_DOMAIN, then print the SPF/DKIM/DMARC records to add to DNS
        type: boolean
        default: false
      wipe:
        description: >-
          DANGER — before deploying, back up and then delete ALL server data
          (Postgres, Elasticsearch, Redis, Kafka, monitoring volumes, media,
          module checkouts). The backup goes to /root/sfera-backup-<timestamp>
        type: boolean
        default: false
      mail_test_to:
        description: >-
          Optional — after deploy, send a real test email to this address and
          show the Postfix queue (leave empty to only run the non-sending check)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # The core must stand on its own: no modules checked out at all.
    name: Core without modules
    runs-on: ubuntu-latest
    env:
      SFERA_DEBUG: '1'
      SFERA_CORS_ALLOW_ALL: '1'
      KAFKA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend (core only)
        run: npm ci && node scripts/test-busy-calls.cjs && node scripts/test-call-recovery.cjs && node scripts/test-commercial-ui.cjs && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: django-server/requirements.txt

      - name: Install backend dependencies
        working-directory: django-server
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Django check, migrations and core tests
        working-directory: django-server/sfera_server
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test sfera_modules sfera_signaling

  ci:
    name: Build and Check (with modules)
    runs-on: ubuntu-latest
    env:
      SFERA_DEBUG: '1'
      SFERA_CORS_ALLOW_ALL: '1'
      KAFKA_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch modules pinned in modules.lock.json
        run: node scripts/modules/fetch.mjs

      - name: Assemble and validate monitoring (core + modules)
        run: |
          node scripts/modules/monitoring.mjs
          # The glob must expand inside the container.
          docker run --rm --entrypoint sh \
            -v "$PWD/django-server/monitoring:/m:ro" prom/prometheus:v2.53.0 \
            -c 'promtool check rules /m/generated/rules/*.yml'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: node scripts/test-busy-calls.cjs && node scripts/test-call-recovery.cjs && node scripts/test-commercial-ui.cjs && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: django-server/requirements.txt

      - name: Install backend dependencies
        working-directory: django-server
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile backend
        working-directory: django-server/sfera_server
        run: python -m compileall sfera_auth sfera_messages sfera_modules sfera_signaling sfera_server ../../modules

      - name: Django system check
        working-directory: django-server/sfera_server
        run: python manage.py check --deploy

      - name: Migrations and backend tests (core + modules)
        working-directory: django-server/sfera_server
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test sfera_modules sfera_signaling $(python -c "from sfera_modules.loader import backend_apps; print(' '.join(backend_apps()))")

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ws-gateway

      - name: Install librdkafka build deps
        # rdkafka (feature cmake-build) собирает librdkafka из исходников —
        # нужны те же либы, что и в ws-gateway/Dockerfile, иначе cargo check падает.
        #
        # Зеркала apt на GitHub-раннерах (azure.archive.ubuntu.com) периодически
        # висят на ретраях по несколько минут. Это лишь sanity-проверка Rust
        # (см. следующий шаг — он тоже необязательный), поэтому не даём apt
        # подвесить весь пайплайн: жёсткий таймаут + не валим job при неудаче.
        timeout-minutes: 6
        continue-on-error: true
        run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            cmake libssl-dev libsasl2-dev pkg-config \
            libcurl4-openssl-dev zlib1g-dev liblz4-dev libzstd-dev

      - name: Check ws-gateway
        working-directory: ws-gateway
        # Sanity-check компиляции Rust. Не блокирует пайплайн: ws-gateway всё
        # равно по-настоящему собирается в Docker при деплое/установке, а сборка
        # librdkafka на раннере бывает медленной/капризной.
        continue-on-error: true
        run: cargo test

  deploy:
    name: Deploy
    needs: [core, ci]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SFERA_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.deploy == true || inputs.wipe == true)) ||
      (github.event_name == 'workflow_dispatch' && inputs.setup_mail == true)
    steps:
      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.SFERA_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.SFERA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.SFERA_DEPLOY_PORT }}
        run: |
          # Деплой включён переменной, но если секреты не заданы — не валим
          # пайплайн, а аккуратно пропускаем шаг.
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::SFERA_DEPLOY_KEY/HOST не заданы — деплой пропущен."
            echo "DEPLOY_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          port="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sfera_deploy
          chmod 600 ~/.ssh/sfera_deploy
          ssh-keyscan -p "$port" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # One-time bootstrap of the self-hosted mail server for the domain. Runs
      # only when the workflow is dispatched with setup_mail=true. Installs
      # Postfix + OpenDKIM (idempotent) and prints the SPF/DKIM/DMARC records to
      # this job's log — copy them into your DNS zone. After this, a normal
      # deploy with SFERA_MAIL_MODE=own wires Django to send via it.
      - name: Bootstrap self-hosted mail (one-time)
        if: env.DEPLOY_SKIP != '1' && inputs.setup_mail == true
        env:
          DEPLOY_HOST: ${{ secrets.SFERA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SFERA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.SFERA_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.SFERA_DEPLOY_PATH }}
          SFERA_DOMAIN: ${{ secrets.SFERA_DOMAIN || vars.SFERA_DOMAIN }}
        run: |
          user="${DEPLOY_USER:-root}"
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_PATH:-/opt/sfera}"
          domain="${SFERA_DOMAIN:-}"
          ssh -i ~/.ssh/sfera_deploy -p "$port" "$user@$DEPLOY_HOST" \
            "set -euo pipefail
             cd '$app_dir'
             git fetch --prune origin main
             git reset --hard origin/main
             sudo env ${domain:+MAIL_DOMAIN='$domain'} bash scripts/linux/mail-install.sh"

      - name: Wipe server data (backup first)
        if: env.DEPLOY_SKIP != '1' && inputs.wipe == true
        env:
          DEPLOY_HOST: ${{ secrets.SFERA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SFERA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.SFERA_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.SFERA_DEPLOY_PATH }}
        run: |
          user="${DEPLOY_USER:-root}"
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_PATH:-/opt/sfera}"
          ssh -i ~/.ssh/sfera_deploy -p "$port" "$user@$DEPLOY_HOST" \
            "set -uo pipefail
             backup=/root/sfera-backup-\$(date +%Y%m%d-%H%M%S)
             sudo mkdir -p \$backup
             cd '$app_dir/django-server'
             sudo docker compose exec -T postgres sh -c 'pg_dumpall -U \"\$POSTGRES_USER\"' | sudo tee \$backup/postgres.sql >/dev/null \
               || echo 'postgres dump skipped'
             sudo tar czf \$backup/files.tgz -C '$app_dir' --ignore-failed-read \
               django-server/sfera_server/media django-server/sfera_server/db.sqlite3 2>/dev/null || true
             [ -d /var/www/sfera/media ] && sudo tar czf \$backup/web-media.tgz -C /var/www/sfera media || true
             sudo ls -la \$backup
             set -e
             sudo systemctl stop sfera-daphne sfera-kafka-worker 2>/dev/null || true
             sudo docker compose down -v --remove-orphans
             sudo rm -rf sfera_server/media sfera_server/db.sqlite3 monitoring/generated /var/www/sfera/media
             cd '$app_dir'
             for wt in modules/*/; do [ -d \"\$wt\" ] && git worktree remove --force \"\$wt\" || true; done
             sudo rm -rf modules
             git worktree prune
             echo 'Server data wiped; backup in '\$backup"

      - name: Deploy main on server
        if: env.DEPLOY_SKIP != '1'
        env:
          DEPLOY_HOST: ${{ secrets.SFERA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SFERA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.SFERA_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.SFERA_DEPLOY_PATH }}
          DEPLOY_MODE: ${{ vars.SFERA_DEPLOY_MODE }}
          DEPLOY_ENV_FILE: ${{ vars.SFERA_DEPLOY_ENV_FILE }}
          SFERA_DOMAIN: ${{ secrets.SFERA_DOMAIN || vars.SFERA_DOMAIN }}
          SFERA_MAIL_MODE: ${{ vars.SFERA_MAIL_MODE }}
          # Optional install selection: modules (comma list, "none" = core only),
          # monitoring left out (e.g. "diary,family" or "core"), SFERA_MONITORING=0.
          SFERA_MODULES: ${{ vars.SFERA_MODULES }}
          SFERA_MONITORING_EXCLUDE: ${{ vars.SFERA_MONITORING_EXCLUDE }}
          SFERA_MONITORING: ${{ vars.SFERA_MONITORING }}
          # Single superuser (manages modules), created once on first deploy.
          SFERA_SUPERUSER_USERNAME: ${{ secrets.SFERA_SUPERUSER_USERNAME }}
          SFERA_SUPERUSER_EMAIL: ${{ secrets.SFERA_SUPERUSER_EMAIL }}
          SFERA_SUPERUSER_PASSWORD: ${{ secrets.SFERA_SUPERUSER_PASSWORD }}
        run: |
          user="${DEPLOY_USER:-root}"
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_PATH:-/opt/sfera}"
          mode="${DEPLOY_MODE:-ssl}"
          env_file="${DEPLOY_ENV_FILE:-/etc/sfera/deploy.env}"
          domain="${SFERA_DOMAIN:-}"
          # Default to self-hosted mail under our domain — without this the
          # deploy would fall back to start-common's built-in 'yandex' default
          # and clobber the own-server setup on every run.
          mail_mode="${SFERA_MAIL_MODE:-own}"
          ssh -i ~/.ssh/sfera_deploy -p "$port" "$user@$DEPLOY_HOST" \
            "set -euo pipefail
             cd '$app_dir'
             git fetch --prune origin main
             git checkout main
             git reset --hard origin/main
             set -a
             [ -f '$env_file' ] && . '$env_file'
             ${domain:+export SFERA_DOMAIN='$domain'}
             export SFERA_MAIL_MODE='$mail_mode'
             ${SFERA_MODULES:+export SFERA_MODULES='$SFERA_MODULES'}
             ${SFERA_MONITORING_EXCLUDE:+export SFERA_MONITORING_EXCLUDE='$SFERA_MONITORING_EXCLUDE'}
             ${SFERA_MONITORING:+export SFERA_MONITORING='$SFERA_MONITORING'}
             ${SFERA_SUPERUSER_USERNAME:+export SFERA_SUPERUSER_USERNAME='$SFERA_SUPERUSER_USERNAME'}
             ${SFERA_SUPERUSER_EMAIL:+export SFERA_SUPERUSER_EMAIL='$SFERA_SUPERUSER_EMAIL'}
             ${SFERA_SUPERUSER_PASSWORD:+export SFERA_SUPERUSER_PASSWORD='$SFERA_SUPERUSER_PASSWORD'}
             set +a
             bash scripts/linux/start-common.sh '$mode'"

      # Post-deploy sanity: is mail actually working? Non-blocking — a failed
      # check annotates a warning but never fails a good deploy. Pass a
      # recipient via the mail_test_to input to also send a real test email.
      - name: Mail health check
        if: env.DEPLOY_SKIP != '1'
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.SFERA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SFERA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.SFERA_DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.SFERA_DEPLOY_PATH }}
          MAIL_TEST_TO: ${{ inputs.mail_test_to }}
        run: |
          user="${DEPLOY_USER:-root}"
          port="${DEPLOY_PORT:-22}"
          app_dir="${DEPLOY_PATH:-/opt/sfera}"
          to="${MAIL_TEST_TO:-}"
          ssh -i ~/.ssh/sfera_deploy -p "$port" "$user@$DEPLOY_HOST" \
            "set -uo pipefail
             cd '$app_dir'
             sudo bash scripts/linux/mail-healthcheck.sh ${to:+--send '$to'}"
