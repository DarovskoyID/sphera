name: Publish signed Sphere point update v29

on:
  push:
    branches: [codex/fast-dm-v29]
    paths:
      - 'output/sdk-replica-20261120/sdk-enable-v29.json'
      - 'output/sdk-replica-20261120/sdk-enable-v29.pyz'
      - 'output/sdk-replica-20261120/sdk-web-v29.tar.gz'
      - 'output/sdk-replica-20261120/server-sdk-runtime-v29.tar.gz'
      - 'output/sdk-replica-20261120/sdk-enable-v30.json'
      - 'output/sdk-replica-20261120/sdk-enable-v30.pyz'
      - 'output/sdk-replica-20261120/sdk-web-v30.tar.gz'
      - 'output/sdk-replica-20261120/sdk-enable-v31.json'
      - 'output/sdk-replica-20261120/sdk-enable-v31.pyz'
      - 'output/sdk-replica-20261120/sdk-web-v31.tar.gz'
      - '.github/workflows/publish-sphere-v29.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload signed point update to the installer release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: wan-trial-20261118
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes "Signed Sphere point update assets."
          gh release upload "$RELEASE_TAG" \
            output/sdk-replica-20261120/sdk-enable-v29.json \
            output/sdk-replica-20261120/sdk-enable-v29.pyz \
            output/sdk-replica-20261120/sdk-web-v29.tar.gz \
            output/sdk-replica-20261120/server-sdk-runtime-v29.tar.gz \
            --clobber
          gh release upload "$RELEASE_TAG" \
            output/sdk-replica-20261120/sdk-enable-v30.json \
            output/sdk-replica-20261120/sdk-enable-v30.pyz \
            output/sdk-replica-20261120/sdk-web-v30.tar.gz \
            --clobber
          gh release upload "$RELEASE_TAG" \
            output/sdk-replica-20261120/sdk-enable-v31.json \
            output/sdk-replica-20261120/sdk-enable-v31.pyz \
            output/sdk-replica-20261120/sdk-web-v31.tar.gz \
            --clobber
