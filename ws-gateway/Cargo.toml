[package]
name = "ionik-ws-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# WebSocket
futures-util = "0.3"

# Redis pub/sub
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# Kafka
rdkafka = { version = "0.37", features = ["cmake-build"] }

# JWT
jsonwebtoken = "9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
