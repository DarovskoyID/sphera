[package]
name = "sfera-bot"
version = "1.0.0"
edition = "2021"
description = "Официальная библиотека для ботов мессенджера Сфера"
license = "MIT"
repository = "https://start-ionik.ru"

[lib]
name = "sfera_bot"
path = "src/lib.rs"

[dependencies]
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "echo_bot"
path = "examples/echo_bot.rs"
