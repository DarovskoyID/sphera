# ============================================================================
#  СПИСОК WS-GATEWAY СЕРВЕРОВ ДЛЯ БАЛАНСИРОВЩИКА
# ============================================================================
#  Это единственный файл, который нужно редактировать при добавлении/удалении
#  серверов. Просто добавьте/уберите строку `server <IP>:<PORT>;`.
#
#  Формат строки:
#     server <IP|host>:<port> [параметры];
#
#  Полезные параметры (необязательные):
#     weight=N        — вес сервера (чем больше, тем больше нагрузки), по умолч. 1
#     max_fails=N     — сколько неудачных попыток до пометки "недоступен" (3)
#     fail_timeout=Ns — на сколько помечать недоступным и интервал проверки (10s)
#     backup          — резервный сервер (используется только если основные легли)
#     down            — временно вывести сервер из ротации
#
#  После изменения файла перезагрузите балансировщик:
#     docker compose exec loadbalancer nginx -s reload
#  или просто:
#     docker compose restart loadbalancer
# ============================================================================

# --- Локальный сервер (тот же docker-compose) ---
server ws-gateway:8001 max_fails=3 fail_timeout=10s;

# --- Дополнительные ноды: раскомментируйте и впишите реальные IP ---
# server 10.0.0.11:8001 max_fails=3 fail_timeout=10s;
# server 10.0.0.12:8001 max_fails=3 fail_timeout=10s;
# server 10.0.0.13:8001 weight=2 max_fails=3 fail_timeout=10s;

# --- Резервный сервер (включается только при падении основных) ---
# server 10.0.0.99:8001 backup;
