worker_processes auto;

events {
    worker_connections 16384;
}

http {
    # --- Логи ---
    log_format lb '$remote_addr -> $upstream_addr [$status] '
                  '$request_time s "$request" rt=$upstream_response_time';
    access_log /var/log/nginx/access.log lb;
    error_log  /var/log/nginx/error.log warn;

    # --- Таймауты под долгоживущие WebSocket-соединения ---
    proxy_connect_timeout   10s;
    proxy_send_timeout      3600s;
    proxy_read_timeout      3600s;
    send_timeout            3600s;

    # Карта для апгрейда HTTP -> WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ========================================================================
    #  ПУЛ WS-GATEWAY СЕРВЕРОВ
    #  Сами адреса серверов живут в servers.conf (редактировать только его).
    # ========================================================================
    upstream ws_backend {
        # Привязка клиента к ноде по IP — важно для WebSocket "липких" сессий.
        # Если используете Redis pub/sub для фан-аута между нодами, можно
        # заменить на least_conn; для более равномерной нагрузки.
        ip_hash;

        include /etc/nginx/servers.conf;

        keepalive 64;
    }

    server {
        listen 8001;
        listen [::]:8001;

        # --- Health-check самого балансировщика ---
        location = /lb-health {
            access_log off;
            return 200 "lb ok\n";
            add_header Content-Type text/plain;
        }

        # --- Проксирование WebSocket и HTTP на пул gateway ---
        location / {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;

            # Заголовки для WebSocket upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # Прокидываем оригинальные данные клиента
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Не буферизуем — стримим сообщения сразу
            proxy_buffering off;
        }
    }
}
