global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ionik-django'
    metrics_path: '/metrics/'
    # Django (Daphne) слушает 8000 по HTTPS (см. run_https.bat).
    scheme: https
    tls_config:
      # Сертификат самоподписанный / на чужой hostname — проверку отключаем.
      insecure_skip_verify: true
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'django'
