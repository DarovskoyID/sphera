global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'ionik-django'
    metrics_path: '/metrics/'
    # Django (Daphne) слушает 8000 по HTTPS (см. run_https.bat).
    scheme: https
    tls_config:
      # Сертификат самоподписанный / на чужой hostname — проверку отключаем.
      insecure_skip_verify: true
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'django'

  - job_name: 'ionik-ws-gateway'
    metrics_path: '/metrics'
    # ws-gateway в той же docker-сети, отдаёт метрики по HTTP на том же порту 8001.
    # Для нескольких реплик (--scale ws-gateway=N) DNS отдаёт их по очереди;
    # для точного снятия со всех нод используйте dns_sd_configs.
    static_configs:
      - targets: ['ws-gateway:8001']
        labels:
          service: 'ws-gateway'
