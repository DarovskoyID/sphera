global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Core + installed modules, assembled by scripts/modules/monitoring.mjs.
rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'sfera-django'
    metrics_path: '/metrics/'
    # Django (Daphne) слушает 8000 по HTTPS (см. run_https.bat).
    scheme: https
    tls_config:
      # Сертификат самоподписанный / на чужой hostname — проверку отключаем.
      insecure_skip_verify: true
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'django'

  - job_name: 'sfera-ws-gateway'
    metrics_path: '/metrics'
    # Auto-discover every ws-gateway replica (docker compose --scale ws-gateway=N
    # publishes all of them under the 'ws-gateway' A record). New nodes added for
    # load distribution are scraped automatically and appear per-instance in Grafana.
    dns_sd_configs:
      - names: ['ws-gateway']
        type: 'A'
        port: 8001
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: 'ws-gateway'

  # Extra full nodes joined over WireGuard for load distribution: drop a target
  # file into ./monitoring/nodes/*.json and they are scraped + charted automatically.
  - job_name: 'sfera-nodes'
    metrics_path: '/metrics'
    file_sd_configs:
      - files: ['/etc/prometheus/nodes/*.json']
        refresh_interval: 30s
