# Правила алертов Prometheus для sfera. Подключаются через rule_files в prometheus.yml.
groups:
  - name: sfera-availability
    rules:
      - alert: DjangoDown
        expr: up{job="sfera-django"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Django/Daphne не отвечает на /metrics"
      - alert: WsGatewayDown
        expr: up{job="sfera-ws-gateway"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "ws-gateway не отвечает на /metrics"
      - alert: KafkaDisconnected
        expr: sfera_kafka_connected == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Django потерял связь с Kafka"
      - alert: RedisDisconnected
        expr: sfera_redis_connected == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Django потерял связь с Redis"
      - alert: DatabaseDisconnected
        expr: sfera_db_connected == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Django потерял связь с БД"

  - name: sfera-resources
    rules:
      - alert: HighCPU
        expr: sfera_cpu_percent > 85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "CPU > 85% более 5 минут (сейчас {{ $value | printf \"%.0f\" }}%)"
      - alert: HighMemory
        expr: sfera_memory_percent > 90
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Память > 90% более 5 минут"
      - alert: HighDisk
        expr: sfera_disk_percent > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Диск > 85%"

  - name: sfera-latency
    rules:
      - alert: HighLatencyP95
        expr: sfera_http_latency_p95_ms > 1000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "HTTP p95 > 1с более 5 минут (сейчас {{ $value | printf \"%.0f\" }} мс)"
      - alert: Http5xxErrors
        expr: rate(sfera_http_errors_5xx_total[5m]) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Поток 5xx-ошибок (> 0.05/с за 5 минут)"
