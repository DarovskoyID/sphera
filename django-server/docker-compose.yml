version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka...'
      cub kafka-ready -b kafka:29092 1 60

      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 12 --replication-factor 1 --topic chat.messages
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic chat.notifications
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic guild.messages
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic guild.notifications

      echo 'Topics created.'
      "

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ionik2026}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      # снижаем потребление памяти: меньше фоновых процессов и аналитики
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_LIVE_MAX_CONNECTIONS: '0'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

  ws-gateway:
    build:
      context: ../ws-gateway
      dockerfile: Dockerfile
    # Порт наружу не публикуем — доступ только через балансировщик.
    # Для нескольких локальных нод: docker compose up -d --scale ws-gateway=3
    expose:
      - "8001"
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # ВАЖНО: $ внутри значения экранируется как $$ — иначе docker-compose
      # подставит $k99wiv2svgs как переменную, секрет станет неполным и не
      # совпадёт с Django SECRET_KEY → ws-gateway вернёт 401 на /ws/chat/.
      JWT_SECRET: ${JWT_SECRET:-django-insecure-e_-am06**zcqtimkp^2))-uxv$$k99wiv2svgs^o300#sgrt+b@}
      WS_BIND: 0.0.0.0:8001
      RUST_LOG: info
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  loadbalancer:
    build:
      context: ../loadbalancer
      dockerfile: Dockerfile
    # Слушает только на localhost — TLS-терминация и публичный порт 8001
    # делает внешний nginx (см. scripts/linux/start-common.sh), проксируя сюда.
    ports:
      - "127.0.0.1:8081:8001"
    volumes:
      # Конфиги монтируем снаружи — IP серверов можно менять без пересборки.
      # После правки servers.conf: docker compose exec loadbalancer nginx -s reload
      - ../loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../loadbalancer/servers.conf:/etc/nginx/servers.conf:ro
    depends_on:
      - ws-gateway
    restart: unless-stopped

volumes:
  redis_data:
  zk_data:
  kafka_data:
  prometheus_data:
  grafana_data:
