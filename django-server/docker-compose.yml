services:
  postgres:
    image: postgres:16-alpine
    # РЎР»СѓС€Р°РµС‚ С‚РѕР»СЊРєРѕ localhost: host-РїСЂРѕС†РµСЃСЃС‹ Daphne/kafka_worker С…РѕРґСЏС‚ РЅР° 127.0.0.1:5432.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfera}
      POSTGRES_USER: ${POSTGRES_USER:-sfera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 320m
    mem_reservation: 128m
    shm_size: 128m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'      # Р»РѕРєР°Р»СЊРЅС‹Р№ РґРѕСЃС‚СѓРї С‚РѕР»СЊРєРѕ СЃ 127.0.0.1
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'    # heap 512MB (СЃРµСЂРІРµСЂ 2 Р“Р‘ вЂ” СЂРёСЃРє РїСЂРёРЅСЏС‚)
      bootstrap.memory_lock: 'false'
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 640m

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # РћРіСЂР°РЅРёС‡РёРІР°РµРј JVM heap: РЅР° 2 Р“Р‘ СЃРµСЂРІРµСЂРµ РґРµС„РѕР»С‚РЅС‹Рµ 512M+ РїСЂРёРІРѕРґРёР»Рё Рє OOM
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    volumes:
      - zk_data:/var/lib/zookeeper/data
    restart: unless-stopped
    mem_limit: 400m
    mem_reservation: 256m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 12
      # Р РµС‚РµРЅС€РЅ РѕРіСЂР°РЅРёС‡РµРЅ Рё РїРѕ РІСЂРµРјРµРЅРё, Рё РїРѕ СЂР°Р·РјРµСЂСѓ вЂ” РёРЅР°С‡Рµ СЃС‚СЂРµСЃСЃ-С‚РµСЃС‚С‹ Р·Р°Р±РёРІР°СЋС‚
      # РґРёСЃРє РіРёРіР°Р±Р°Р№С‚Р°РјРё Р»РѕРіРѕРІ (СЃРµСЂРІРµСЂ РїР°РґР°Р» РёР·-Р·Р° 100% РґРёСЃРєР°). Р’РѕСЂРєРµСЂ С‡РёС‚Р°РµС‚ СЃ
      # latest Рё РїРѕС‚СЂРµР±Р»СЏРµС‚ СЃСЂР°Р·Сѓ, РґРѕР»РіРёР№ СЂРµС‚РµРЅС€РЅ РЅРµ РЅСѓР¶РµРЅ.
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_RETENTION_BYTES: 67108864      # ~64 РњР‘ РЅР° РїР°СЂС‚РёС†РёСЋ в†’ ~2 Р“Р‘ РїРѕС‚РѕР»РѕРє РЅР° РІСЃРµ 30 РїР°СЂС‚РёС†РёР№
      KAFKA_LOG_SEGMENT_BYTES: 33554432        # СЃРµРіРјРµРЅС‚ 32 РњР‘ (РјРµРЅСЊС€Рµ Р»РёРјРёС‚Р° вЂ” С‡С‚РѕР±С‹ РѕС‡РёСЃС‚РєР° РїРѕ Р±Р°Р№С‚Р°Рј СЂР°Р±РѕС‚Р°Р»Р°)
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      # РћРіСЂР°РЅРёС‡РёРІР°РµРј JVM heap: РґРµС„РѕР»С‚ -Xmx1G РЅР° 2 Р“Р‘ СЃРµСЂРІРµСЂРµ РІС‹Р·С‹РІР°Р» OOM,
      # СЏРґСЂРѕ СѓР±РёРІР°Р»Рѕ РёРјРµРЅРЅРѕ СЌС‚РѕС‚ РїСЂРѕС†РµСЃСЃ (java). 512M РґРѕСЃС‚Р°С‚РѕС‡РЅРѕ РґР»СЏ РЅРёР·РєРѕР№ РЅР°РіСЂСѓР·РєРё.
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    mem_limit: 900m
    mem_reservation: 512m

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka...'
      cub kafka-ready -b kafka:29092 1 60

      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 12 --replication-factor 1 --topic chat.messages
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic chat.notifications
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic guild.messages
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6  --replication-factor 1 --topic guild.notifications

      echo 'Topics created.'
      "

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./monitoring/nodes:/etc/prometheus/nodes:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 384m
    mem_reservation: 192m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    mem_limit: 96m
    mem_reservation: 32m

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      # СЃРЅРёР¶Р°РµРј РїРѕС‚СЂРµР±Р»РµРЅРёРµ РїР°РјСЏС‚Рё: РјРµРЅСЊС€Рµ С„РѕРЅРѕРІС‹С… РїСЂРѕС†РµСЃСЃРѕРІ Рё Р°РЅР°Р»РёС‚РёРєРё
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_LIVE_MAX_CONNECTIONS: '0'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m

  ws-gateway:
    build:
      context: ../ws-gateway
      dockerfile: Dockerfile
    # РџРѕСЂС‚ РЅР°СЂСѓР¶Сѓ РЅРµ РїСѓР±Р»РёРєСѓРµРј вЂ” РґРѕСЃС‚СѓРї С‚РѕР»СЊРєРѕ С‡РµСЂРµР· Р±Р°Р»Р°РЅСЃРёСЂРѕРІС‰РёРє.
    # Р”Р»СЏ РЅРµСЃРєРѕР»СЊРєРёС… Р»РѕРєР°Р»СЊРЅС‹С… РЅРѕРґ: docker compose up -d --scale ws-gateway=3
    expose:
      - "8001"
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Must match Django SECRET_KEY/SFERA_SECRET_KEY or ws-gateway will reject JWTs.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Daphne слушает 127.0.0.1 — из контейнера недоступен. Авторизуемся через
      # публичный nginx API (см. start-common.sh::write_compose_env, пишет .env).
      DJANGO_WS_AUTHZ_URL: ${DJANGO_WS_AUTHZ_URL:-https://start-ionik.ru:8000/api/ws/authorize/}
      WS_BIND: 0.0.0.0:8001
      RUST_LOG: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - kafka
    restart: unless-stopped

  loadbalancer:
    build:
      context: ../loadbalancer
      dockerfile: Dockerfile
    # РЎР»СѓС€Р°РµС‚ С‚РѕР»СЊРєРѕ РЅР° localhost вЂ” TLS-С‚РµСЂРјРёРЅР°С†РёСЏ Рё РїСѓР±Р»РёС‡РЅС‹Р№ РїРѕСЂС‚ 8001
    # РґРµР»Р°РµС‚ РІРЅРµС€РЅРёР№ nginx (СЃРј. scripts/linux/start-common.sh), РїСЂРѕРєСЃРёСЂСѓСЏ СЃСЋРґР°.
    ports:
      - "127.0.0.1:8081:8001"
    volumes:
      # РљРѕРЅС„РёРіРё РјРѕРЅС‚РёСЂСѓРµРј СЃРЅР°СЂСѓР¶Рё вЂ” IP СЃРµСЂРІРµСЂРѕРІ РјРѕР¶РЅРѕ РјРµРЅСЏС‚СЊ Р±РµР· РїРµСЂРµСЃР±РѕСЂРєРё.
      # РџРѕСЃР»Рµ РїСЂР°РІРєРё servers.conf: docker compose exec loadbalancer nginx -s reload
      - ../loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../loadbalancer/servers.conf:/etc/nginx/servers.conf:ro
    depends_on:
      - ws-gateway
    restart: unless-stopped

volumes:
  pg_data:
  es_data:
  redis_data:
  zk_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
